<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马里奥九宫格 - 点击消失</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #5c94fc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; 
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 60px;
            position: relative;
        }

        .cube-wrapper {
            width: 80px;
            height: 80px;
            position: relative;
            transform-style: preserve-3d;
            /* 过渡属性：放大、透明度、滤镜 */
            transition: transform 0.8s ease-out, opacity 0.8s ease-out, filter 0.8s ease-out;
            cursor: pointer;
            z-index: 1;
        }

        /* 👇 鼠标移上去的终极状态：放大、变透明、亮度拉高，并且不再响应鼠标 */
        .cube-wrapper.is-dead {
            transform: scale(2.5);        /* 放大 2.5 倍 */
            opacity: 0;                   /* 完全透明 */
            filter: brightness(2);        /* 变亮，像发光一样消失 */
            pointer-events: none;         /* 失去鼠标响应，鼠标穿透 */
            z-index: 10;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            animation: spinY 5s infinite linear;
        }

        @keyframes spinY {
            0%   { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* 方块材质 */
        .face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #f8c820;
            border: 3px solid #b87c00;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            font-size: 46px;
            color: #b87c00;
            box-sizing: border-box;
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.6), 
                        inset -3px -3px 0px rgba(0, 0, 0, 0.25);
            border-radius: 4px;
            backface-visibility: hidden; 
        }

        /* 六个面 */
        .front  { transform: translateZ(40px); }
        .back   { transform: rotateY(180deg) translateZ(40px); }
        .right  { transform: rotateY(90deg) translateZ(40px); }
        .left   { transform: rotateY(-90deg) translateZ(40px); }
        .top    { transform: rotateX(90deg) translateZ(40px); }
        .bottom { transform: rotateX(-90deg) translateZ(40px); }

        /* 通过透视控制视角 */
        .row-top { transform: rotateX(25deg); }   
        .row-middle { transform: rotateX(0deg); } 
        .row-bottom { transform: rotateX(-25deg); } 

    </style>
</head>
<body>

    <div class="grid-container" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        const rows = 3;
        const cols = 3;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'cube-wrapper';
                
                if (r === 0) wrapper.classList.add('row-top');
                if (r === 1) wrapper.classList.add('row-middle');
                if (r === 2) wrapper.classList.add('row-bottom');

                const cube = document.createElement('div');
                cube.className = 'cube';
                
                const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
                faces.forEach(face => {
                    const faceDiv = document.createElement('div');
                    faceDiv.className = `face ${face}`;
                    faceDiv.innerHTML = '?'; 
                    cube.appendChild(faceDiv);
                });

                cube.style.animationDelay = `${(r * cols + c) * 0.2}s`;

                // 👇 监听鼠标移入事件：一旦移入，永久加上 is-dead 类
                wrapper.addEventListener('mouseenter', function() {
                    this.classList.add('is-dead');
                });

                wrapper.appendChild(cube);
                grid.appendChild(wrapper);
            }
        }
    </script>

</body>
</html>
